about.title=Sobre o DFiles
about.body=DFiles é um gerenciador de arquivos livre e de código aberto, construído com JavaFX.\n\nIniciado por Daniel de Souza Carvalho, com apoio de desenvolvimento do Claude Code, o assistente de programação com IA da Anthropic.\n\nContribuições voluntárias são bem-vindas — faça um fork do projeto no GitHub e abra um pull request.

