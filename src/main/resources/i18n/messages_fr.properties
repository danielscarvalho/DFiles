about.title=À propos de DFiles
about.body=DFiles est un gestionnaire de fichiers libre et open-source, créé avec JavaFX.\n\nDémarré par Daniel de Souza Carvalho, avec l'assistance au développement de Claude Code, l'assistant de programmation IA d'Anthropic.\n\nLes contributions volontaires sont les bienvenues : forkez le projet sur GitHub et ouvrez une pull request.

