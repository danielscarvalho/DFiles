about.title=Acerca de DFiles
about.body=DFiles es un gestor de archivos libre y de código abierto, creado con JavaFX.\n\nIniciado por Daniel de Souza Carvalho, con la asistencia de desarrollo de Claude Code, el asistente de programación con IA de Anthropic.\n\nLas contribuciones voluntarias son bienvenidas: haz un fork del proyecto en GitHub y abre un pull request.

