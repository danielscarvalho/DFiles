about.title=Informazioni su DFiles
about.body=DFiles è un file manager gratuito e open source, sviluppato con JavaFX.\n\nAvviato da Daniel de Souza Carvalho, con l'assistenza di sviluppo di Claude Code, l'assistente di programmazione IA di Anthropic.\n\nI contributi volontari sono benvenuti — effettua un fork del progetto su GitHub e apri una pull request.

